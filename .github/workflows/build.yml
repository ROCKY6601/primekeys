name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          base64 -d bundle.b64 > project.zip
          unzip -q project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p PrimeKeys assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeKeys-APK
          path: PrimeKeys/app/build/outputs/apk/debug/app-debug.apk
